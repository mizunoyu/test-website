<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品レビュー投稿完了｜池田屋ランドセル【公式通販】</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #333;
      background-color: #f7f5f3;
    }
    a {
      color: inherit;
      text-decoration: none;
    }

    /* 共通ヘッダー（ボルドー） */
    .ikd-header {
      background-color: #4a1525;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ikd-logo {
      font-size: 14px;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.6);
      padding: 4px 10px;
      border-radius: 15px;
    }
    .ikd-header-nav {
      display: flex;
      gap: 16px;
      font-size: 10px;
      text-align: center;
    }

    /* コンテナ */
    .review-container {
      max-width: 650px;
      margin: 30px auto;
      background: #fff;
      padding: 30px 24px;
      border-radius: 8px;
      border: 1px solid #e0dedc;
      text-align: center;
    }

    /* 完了アイコン・メッセージ */
    .complete-icon-wrap {
      width: 60px;
      height: 60px;
      background: #611822;
      color: #fff;
      font-size: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .complete-title {
      font-size: 20px;
      font-weight: bold;
      color: #4a1525;
      margin-bottom: 16px;
      letter-spacing: 0.05em;
    }
    .complete-message {
      font-size: 13px;
      color: #555;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    /* 誘導ボタンエリア */
    .complete-action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 320px;
      margin: 0 auto;
    }
    .btn-action {
      display: block;
      width: 100%;
      padding: 12px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 24px;
      text-align: center;
      cursor: pointer;
    }
    .btn-primary {
      background: #611822;
      color: #fff;
      border: none;
    }
    .btn-primary:hover {
      background: #4a1525;
    }
    .btn-secondary {
      background: #fff;
      color: #333;
      border: 1px solid #ccc;
    }
    .btn-secondary:hover {
      background: #f5f5f5;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header class="ikd-header">
    <div class="ikd-logo">池田屋ランドセル</div>
    <div class="ikd-header-nav">
      <div>店舗一覧</div>
      <div>カート</div>
      <div>メニュー</div>
    </div>
  </header>

  <div class="review-container">
    
    <!-- 完了アイコン -->
    <div class="complete-icon-wrap">
      ✓
    </div>

    <h1 class="complete-title">レビューの投稿が完了しました</h1>
    
    <p class="complete-message">
      商品レビューをご投稿いただき、誠にありがとうございました。
    </p>

    <!-- 遷移ボタン群 -->
    <div class="complete-action-buttons">
      <a href="mypage_history.html" class="btn-action btn-primary">購入履歴に戻る</a>
      <a href="index.html" class="btn-action btn-secondary">トップページへ戻る</a>
    </div>

  </div>

</body>
</html>
